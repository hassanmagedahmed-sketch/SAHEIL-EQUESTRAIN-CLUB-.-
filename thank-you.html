</head><body><div class="wrap"><header class="top"><div class="brand-cluster"><a class="brand" href="index.html">SAHEIL</a><span class="account-chip" id="account-chip" hidden></span></div><div class="top-right"><a class="back" href="index.html">Back to Home</a></div></header><main class="card"><div class="kicker">SAHEIL · ACCOUNT CREATED</div><h1>THANKS FOR SIGN UP</h1><p id="thanks-personal">Your account was created successfully. Welcome to Saheil.</p><p style="font-size:22px;font-weight:900;color:#f2d4a4" id="person-name"></p><div class="actions"><a class="btn primary" href="index.html">Continue to Saheil ↗</a><a class="btn secondary" href="login.html">Go to Login</a></div></main></div><script>(function(){let u=null;try{u=JSON.parse(localStorage.getItem('saheil_user')||'null')}catch(e){}if(u&&u.name){document.getElementById('person-name').textContent=u.name;const c=document.getElementById('account-chip');c.textContent=u.name;c.hidden=false;}else{window.location.replace('signup.html');}})();</script><script>(function(){try{const u=JSON.parse(localStorage.getItem('saheil_user')||'null');if(u&&u.name){const c=document.getElementById('account-chip');if(c){c.textContent=u.name;c.hidden=false;}const p=document.getElementById('thanks-personal');if(p)p.textContent='Welcome, '+u.name+'! Your account was created successfully. Tell us what you would like to book and we will help you on WhatsApp.';}}catch(e){}})();</script></body></html>
