<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Saheil</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17110d;color:#fffaf2;font-family:Inter,Arial,sans-serif}a{text-decoration:none;color:inherit}input,button{font:inherit}.wrap{max-width:1050px;margin:auto;padding:0 24px}.top{min-height:78px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand-cluster{display:flex;align-items:center;gap:16px;min-width:0}.brand{font-weight:900;letter-spacing:3px}.account-chip{display:inline-flex;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 11px;border-radius:999px;background:#c79a5c18;border:1px solid #c79a5c66;color:#efcf9f;font-size:11px;font-weight:900}.account-chip[hidden],[hidden]{display:none!important}.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.back{border:1px solid #c79a5c55;border-radius:10px;padding:10px 14px;color:#e5c796;font-size:11px}.card{margin:42px auto;padding:clamp(24px,4vw,42px);max-width:720px;border:1px solid #c79a5c3b;border-radius:24px;background:linear-gradient(145deg,#2b1b12,#1c120d);box-shadow:0 25px 70px #0007}.kicker{font-size:10px;letter-spacing:3px;color:#c79a5c;font-weight:900}.card h1{font:normal clamp(42px,7vw,74px)/.98 Georgia,serif;margin:14px 0 18px}.card p{color:#c5b6a8;line-height:1.8}.field{display:block;margin-top:17px;color:#ead9c8;font-size:12px;font-weight:800}.field input{display:block;margin-top:8px;width:100%;padding:14px 13px;border-radius:10px;border:1px solid #ffffff20;background:#17110d;color:#fffaf2;outline:none}.field input:focus{border-color:#c79a5c;box-shadow:0 0 0 3px #c79a5c1c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:10px;border:1px solid #c79a5c66;font-size:12px;font-weight:900;cursor:pointer}.primary{background:#c79a5c;color:#1b120b;border-color:#c79a5c}.secondary{background:#ffffff05;color:#fff}.error,.notice,.session{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:13px;font-weight:800;line-height:1.6}.error{display:none;border:1px solid #e67d6d66;color:#ffb7aa;background:#8f231b22}.error.show{display:block}.notice{display:none;border:1px solid #c79a5c55;color:#f4d7a5;background:#c79a5c11}.notice.show{display:block}.session{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid #c79a5c55;background:#c79a5c0d;color:#efd6b1}.session strong{color:#fff}.session a{color:#dfb36f;text-decoration:underline}.session button{border:0;background:transparent;color:#e3bb7d;text-decoration:underline;cursor:pointer;font-weight:800}.small-note{margin-top:20px;color:#9f8d7f;font-size:11px;line-height:1.7}@media(max-width:600px){.wrap{padding:0 15px}.top{min-height:68px}.brand-cluster{gap:10px}.account-chip{max-width:110px;font-size:9px;padding:7px 8px}.card{margin:28px auto;padding:24px 18px;border-radius:19px}.card h1{font-size:clamp(39px,11vw,58px)}}
</style>

<style id="saheil-mobile-parity-inner-pages">
*{box-sizing:border-box}
@media(max-width:600px){
  html,body{max-width:100%;overflow-x:hidden}
  .wrap,.page{width:100%;padding-left:14px!important;padding-right:14px!important}
  .top{display:flex!important;flex-wrap:nowrap!important;gap:10px!important;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
  .top::-webkit-scrollbar{display:none}
  .brand-cluster,.top-right{display:flex!important;flex:0 0 auto!important;flex-wrap:nowrap!important;gap:8px!important}
  .card,.panel{padding:clamp(17px,4vw,28px)!important;border-radius:18px!important}
  .card{margin:clamp(20px,5vw,36px) auto!important}
  h1{font-size:clamp(30px,8vw,54px)!important;line-height:1!important}
  .btn{padding:10px 12px!important;font-size:10px!important;white-space:normal}
  .grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
  .grid img{width:100%!important;height:clamp(125px,38vw,230px)!important;object-fit:cover!important}
  .hero img{width:100%;height:clamp(230px,58vw,390px)!important;object-fit:cover!important}
  .row{gap:8px!important;flex-wrap:wrap!important}
  .field input{min-width:0;width:100%}
  .actions{display:flex!important;flex-direction:row!important;flex-wrap:wrap!important;gap:8px!important}
}
</style>

</head>
<body><div class="wrap">
<header class="top"><div class="brand-cluster"><a class="brand" href="index.html">SAHEIL</a><span class="account-chip" id="account-chip" hidden></span></div><div class="top-right"><a class="back" href="index.html">Back to Home</a><a class="back" href="signup.html">Sign Up</a></div></header>
<main class="card"><div class="kicker">SAHEIL · ACCOUNT</div><h1>Welcome back</h1><p>Sign in with the mobile number and password you used when signing up.</p>
<div class="session" id="session-box" hidden><span id="session-text"></span><a href="welcome-back.html">Continue to Saheil ↗</a><button type="button" id="switch-account">Switch account</button></div>
<form id="login-form" novalidate><label class="field">Mobile number<input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="01012345678" required></label><label class="field">Password<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label>
<div class="actions"><button class="btn primary" type="submit">Login</button><a class="btn secondary" href="signup.html">New to Saheil? Sign Up</a></div>
<div class="error" id="form-error" role="alert"></div><div class="notice" id="form-notice" role="status"></div></form>
<div class="small-note">This preview saves account details in this browser only. It does not send SMS and is not a secure production account system.</div>
</main></div>
<script>
(function(){
 const $=id=>document.getElementById(id), chip=$('account-chip'), sessionBox=$('session-box'), sessionText=$('session-text'), form=$('login-form'), phoneInput=$('phone'), passwordInput=$('password'), error=$('form-error'), notice=$('form-notice');
 const parse=(v,fallback)=>{try{const x=JSON.parse(v);return x??fallback}catch(e){return fallback}};
 const getUser=()=>parse(localStorage.getItem('saheil_user'),'null');
 const getAccounts=()=>{const x=parse(localStorage.getItem('saheil_accounts'),'[]');return Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[])};
 const normPhone=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0')&&d.length===11)d='20'+d.slice(1);else if(d.length===10&&/^1[0125]/.test(d))d='20'+d;return d};
 const active=getUser();
 if(active&&active.name){chip.textContent=active.name;chip.hidden=false;sessionText.textContent='YOU ARE ALREADY LOGGED IN AS '+active.name+'.';sessionBox.hidden=false;if(active.phone||active.identifier)phoneInput.value=active.phone||active.identifier;}
 $('switch-account').addEventListener('click',()=>{localStorage.removeItem('saheil_user');location.reload()});
 const lang=localStorage.getItem('saheil_lang')||'en';
 const msg={en:{required:'ENTER YOUR MOBILE NUMBER AND PASSWORD.',phone:'ENTER A VALID MOBILE NUMBER.',signup:'YOU MUST SIGN UP FIRST!!',password:'INCORRECT PASSWORD. PLEASE TRY AGAIN.'},ar:{required:'اكتب رقم الموبايل وكلمة المرور.',phone:'اكتب رقم موبايل صحيح.',signup:'لازم تعمل حساب الأول!',password:'كلمة المرور غير صحيحة. حاول مرة أخرى.'},fr:{required:'Saisissez votre téléphone et votre mot de passe.',phone:'Saisissez un numéro valide.',signup:'VOUS DEVEZ D’ABORD CRÉER UN COMPTE !',password:'Mot de passe incorrect. Réessayez.'},de:{required:'Gib Handynummer und Passwort ein.',phone:'Gib eine gültige Handynummer ein.',signup:'BITTE ERST EIN KONTO ERSTELLEN!',password:'Falsches Passwort. Bitte erneut versuchen.'},es:{required:'Introduce tu móvil y contraseña.',phone:'Introduce un número válido.',signup:'¡PRIMERO DEBES REGISTRARTE!',password:'Contraseña incorrecta. Inténtalo de nuevo.'}}[lang]||{required:'ENTER YOUR MOBILE NUMBER AND PASSWORD.',phone:'ENTER A VALID MOBILE NUMBER.',signup:'YOU MUST SIGN UP FIRST!!',password:'INCORRECT PASSWORD. PLEASE TRY AGAIN.'};
 function message(el,txt){el.textContent=txt;el.classList.add('show')}
 function clearMessages(){error.textContent='';error.classList.remove('show');notice.textContent='';notice.classList.remove('show')}
 async function passwordMatches(account,password){if(!account)return false;if(account.passwordHash){if(account.passwordHash.startsWith('demo:'))return account.passwordHash.slice(5)===password;try{const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(password));const hash=Array.from(new Uint8Array(bytes)).map(b=>b.toString(16).padStart(2,'0')).join('');return hash===account.passwordHash}catch(e){return false}}return !!(account.password&&account.password===password)}
 form.addEventListener('submit',async e=>{e.preventDefault();clearMessages();const rawPhone=phoneInput.value.trim(),pass=passwordInput.value;if(!rawPhone||!pass){message(error,msg.required);return}const phone=normPhone(rawPhone);if(phone.length<10||phone.length>15){message(error,msg.phone);return}
   if(active&&active.name&&normPhone(active.phone||active.identifier)===phone){location.href='welcome-back.html';return}
   const accounts=getAccounts();const account=accounts.find(a=>normPhone(a.phone||a.identifier||a.displayPhone)===phone);
   if(!account||(!account.passwordHash&&!account.password)){message(error,msg.signup);return}
   if(!await passwordMatches(account,pass)){message(error,msg.password);return}
   const user={name:account.name,phone:account.phone||phone,identifier:account.phone||phone,loggedInAt:new Date().toISOString()};localStorage.setItem('saheil_user',JSON.stringify(user));location.href='welcome-back.html';
 });
})();
</script></body></html>
